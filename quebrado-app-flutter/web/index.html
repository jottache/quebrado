<!DOCTYPE html><html><head>
  <!--

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OrtizApp">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>OrtizApp</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      -webkit-overscroll-behavior: none;
    }

    flutter-view {
      overscroll-behavior: none;
      overscroll-behavior-x: none;
    }
  </style>
  
  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #110E12; /* OrtizPalette.bg */
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    /* Texto de la pantalla de carga (spec 02). Colores = OrtizPalette
       (accent #FF8466, muted #9C8F98); fuente = Bricolage empaquetada. */
    @font-face {
      font-family: "OrtizSplash";
      src: url("assets/assets/fonts/bricolage/BricolageGrotesque-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    .splash-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }
    .splash-title {
      font-family: "OrtizSplash", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 44px;
      letter-spacing: -0.02em;
      color: #FF8466;
      animation: splash-breathe 1.6s ease-in-out infinite;
    }
    .splash-sub {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #9C8F98;
    }
    @keyframes splash-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .55; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-title { animation: none; }
    }
  </style>
  <!-- Cache prevention for development mode -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <script id="splash-screen-script">
    // 1. Unregister all service workers in development mode to prevent stale caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }

    // 2. Robust splash removal
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (splash) splash.remove();
      const branding = document.getElementById("splash-branding");
      if (branding) branding.remove();
      document.body.style.background = "transparent";
    }

    function checkAndRemoveSplash() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-renderer')) {
        removeSplashFromWeb();
        return true;
      }
      return false;
    }

    // Auto-remove splash when Flutter engine attaches to DOM
    const splashObserver = new MutationObserver(function(mutations, obs) {
      if (checkAndRemoveSplash()) {
        obs.disconnect();
      }
    });

    if (document.body) {
      splashObserver.observe(document.body, { childList: true, subtree: true });
    } else {
      document.addEventListener("DOMContentLoaded", function() {
        splashObserver.observe(document.body, { childList: true, subtree: true });
      });
    }

    // Fast interval polling
    var splashInterval = setInterval(function() {
      if (checkAndRemoveSplash()) {
        clearInterval(splashInterval);
      }
    }, 100);

    // Guaranteed fallback timeout: after 2.5s always remove splash
    setTimeout(function() {
      removeSplashFromWeb();
      clearInterval(splashInterval);
    }, 2500);

    window.addEventListener('flutter-first-frame', function() {
      removeSplashFromWeb();
    });

    // 4. Auto-trigger Flutter start if DWDS is waiting for Dart Debug Extension
    var _appStarted = false;
    function ensureFlutterStarts() {
      if (_appStarted || window.$dartMainExecuted) return;
      if (typeof window.$dartRunMain === 'function') {
        _appStarted = true;
        clearInterval(flutterStartInterval);
        try {
          window.$dartRunMain();
        } catch (e) {
          console.warn('Auto dartRunMain notice:', e);
        }
      }
    }
    var flutterStartInterval = setInterval(function() {
      if (window.$dartMainExecuted || _appStarted) {
        clearInterval(flutterStartInterval);
      } else {
        ensureFlutterStarts();
      }
    }, 150);
  </script>
</head>
<body>
  <!-- Pantalla de carga con texto (spec 02, pedido de la persona): sustituye al
       logo verde de Quebrado. OJO: `dart run flutter_native_splash:create`
       regeneraría este bloque con la imagen; no lo ejecutes sin rehacer esto. -->
  <div id="splash" class="center splash-text" aria-hidden="true">
    <span class="splash-title">Ortiz</span>
    <span class="splash-sub">Cargando tu suite…</span>
  </div>
  
  
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
