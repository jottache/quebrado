<!DOCTYPE html><html><head>

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>OrtizApp</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      -webkit-overscroll-behavior: none;
    }

    flutter-view {
      overscroll-behavior: none;
      overscroll-behavior-x: none;
    }
  </style>
  
  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #EEEEEE;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <!-- Cache prevention for development mode -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <script id="splash-screen-script">
    // 1. Unregister all service workers in development mode to prevent stale caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }

    // 2. Robust splash removal
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (splash) splash.remove();
      const branding = document.getElementById("splash-branding");
      if (branding) branding.remove();
      document.body.style.background = "transparent";
    }

    function checkAndRemoveSplash() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-renderer')) {
        removeSplashFromWeb();
        return true;
      }
      return false;
    }

    // Auto-remove splash when Flutter engine attaches to DOM
    const splashObserver = new MutationObserver(function(mutations, obs) {
      if (checkAndRemoveSplash()) {
        obs.disconnect();
      }
    });

    if (document.body) {
      splashObserver.observe(document.body, { childList: true, subtree: true });
    } else {
      document.addEventListener("DOMContentLoaded", function() {
        splashObserver.observe(document.body, { childList: true, subtree: true });
      });
    }

    // Fast interval polling
    var splashInterval = setInterval(function() {
      if (checkAndRemoveSplash()) {
        clearInterval(splashInterval);
      }
    }, 100);

    // Guaranteed fallback timeout: after 2.5s always remove splash
    setTimeout(function() {
      removeSplashFromWeb();
      clearInterval(splashInterval);
    }, 2500);

    window.addEventListener('flutter-first-frame', function() {
      removeSplashFromWeb();
    });

    // 4. Auto-trigger Flutter start if DWDS is waiting for Dart Debug Extension
    var _appStarted = false;
    function ensureFlutterStarts() {
      if (_appStarted || window.$dartMainExecuted) return;
      if (typeof window.$dartRunMain === 'function') {
        _appStarted = true;
        clearInterval(flutterStartInterval);
        try {
          window.$dartRunMain();
        } catch (e) {
          console.warn('Auto dartRunMain notice:', e);
        }
      }
    }
    var flutterStartInterval = setInterval(function() {
      if (window.$dartMainExecuted || _appStarted) {
        clearInterval(flutterStartInterval);
      } else {
        ensureFlutterStarts();
      }
    }, 150);
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
